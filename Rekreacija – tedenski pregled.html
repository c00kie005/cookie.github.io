<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rekreacija – tedenski pregled</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #EEF2F0;
    --surface: #FFFFFF;
    --ink: #16262B;
    --muted: #5B6E72;
    --line: #D3DDDA;
    --accent: #16705A;
    --on-accent: #FFFFFF;
    --past: #B7C6C3;
    --up: #16705A;
    --down: #B04A2F;
    --focus: #0B57D0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #101719;
      --surface: #182124;
      --ink: #E4EEEC;
      --muted: #93A8AC;
      --line: #2B3A3E;
      --accent: #4CC3A0;
      --on-accent: #08201A;
      --past: #3C5155;
      --up: #4CC3A0;
      --down: #E8896C;
      --focus: #8AB4F8;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #101719;
    --surface: #182124;
    --ink: #E4EEEC;
    --muted: #93A8AC;
    --line: #2B3A3E;
    --accent: #4CC3A0;
    --on-accent: #08201A;
    --past: #3C5155;
    --up: #4CC3A0;
    --down: #E8896C;
    --focus: #8AB4F8;
  }
  [hidden] { display: none !important; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }
  main { max-width: 760px; margin: 0 auto; padding: 28px 18px 48px; }
  h1 { font-size: clamp(2rem, 6vw, 2.9rem); font-weight: 800; line-height: 1.05; margin: 0 0 10px; letter-spacing: -0.02em; }
  h2 { font-size: 1.15rem; font-weight: 600; margin: 0 0 12px; }
  .summary { font-size: 1.15rem; margin: 0 0 4px; max-width: 60ch; }
  .summary-sub { color: var(--muted); margin: 0 0 6px; }
  .summary-sub:empty { display: none; }
  header { margin-bottom: 22px; }
  section { border-top: 1px solid var(--line); padding: 22px 0; }
  header + section { border-top: none; padding-top: 4px; }

  .controls { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; margin-bottom: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button {
    font: inherit; border: 0; background: transparent; color: var(--ink);
    padding: 7px 14px; cursor: pointer; min-height: 38px;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg { max-width: 100%; overflow-x: auto; }
  .seg button { white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }

  label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; width: 100%; min-height: 42px;
  }
  .controls select { width: auto; min-width: 160px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .chart { display: block; width: 100%; height: auto; }
  .chart .base { stroke: var(--line); stroke-width: 1; }
  .chart .bar { fill: var(--past); }
  .chart .bar.cur { fill: var(--accent); }
  .chart text { font-family: inherit; font-size: 12.5px; }
  .chart .val { fill: var(--muted); }
  .chart .val.curt { fill: var(--ink); font-weight: 600; }
  .chart .lab { fill: var(--muted); }
  .chart .lab.curt { fill: var(--ink); font-weight: 600; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  .primary {
    font: inherit; font-weight: 600; background: var(--accent); color: var(--on-accent);
    border: 0; border-radius: 8px; padding: 10px 20px; min-height: 44px; cursor: pointer;
  }
  .error { color: var(--down); margin: 0; min-height: 1.5em; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th { font-weight: 600; color: var(--muted); font-size: 0.9rem; }
  tfoot td { font-weight: 600; border-bottom: 0; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .empty { color: var(--muted); margin: 0; }

  .week { margin-bottom: 22px; }
  .week-head { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; margin-bottom: 4px; }
  .week-head span:last-child { color: var(--muted); font-weight: 400; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.entry {
    display: grid; grid-template-columns: 4.2rem 1fr auto auto; gap: 4px 12px;
    align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  li.entry .note { grid-column: 2 / 4; color: var(--muted); font-size: 0.92rem; overflow-wrap: anywhere; }
  .del {
    font: inherit; font-size: 0.9rem; color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; min-height: 32px;
  }
  .del.confirm { color: var(--down); border-color: var(--down); }
  .status { color: var(--muted); font-size: 0.88rem; margin-top: 8px; }

  @media (max-width: 520px) {
    .form-grid { grid-template-columns: 1fr; }
    li.entry { grid-template-columns: 3.6rem 1fr auto; }
    li.entry .del { grid-column: 3; grid-row: 1; }
    li.entry .amount { grid-column: 2 / 3; }
    li.entry .note { grid-column: 2 / -1; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Rekreacija</h1>
    <p class="summary" id="summary" aria-live="polite"></p>
    <p class="summary-sub" id="summary-sub"></p>
    <p class="summary-sub" id="import-msg"></p>
  </header>

  <section aria-labelledby="h-chart">
    <h2 id="h-chart">Zadnjih 8 tednov</h2>
    <div class="controls">
      <div>
        <label id="lbl-metric">Prikaz</label>
        <div class="seg" role="group" aria-labelledby="lbl-metric">
          <button type="button" data-metric="min" aria-pressed="true">Čas</button>
          <button type="button" data-metric="km" aria-pressed="false">Razdalja</button>
          <button type="button" data-metric="hr" aria-pressed="false">Pulz</button>
          <button type="button" data-metric="power" aria-pressed="false">Moč</button>
          <button type="button" data-metric="cad" aria-pressed="false">Kadenca</button>
        </div>
      </div>
      <div>
        <label for="filter">Aktivnost</label>
        <select id="filter"></select>
      </div>
    </div>
    <div id="chart"></div>
  </section>

  <section aria-labelledby="h-form">
    <h2 id="h-form">Nov vnos</h2>
    <form id="form" novalidate>
      <div class="form-grid">
        <div>
          <label for="f-date">Datum</label>
          <input type="date" id="f-date" required>
        </div>
        <div>
          <label for="f-type">Aktivnost</label>
          <select id="f-type"></select>
        </div>
        <div>
          <label for="f-min">Trajanje (min)</label>
          <input type="number" id="f-min" inputmode="numeric" min="1" max="1440" step="1" placeholder="npr. 45" required>
        </div>
        <div>
          <label for="f-km">Razdalja (km), neobvezno</label>
          <input type="number" id="f-km" inputmode="decimal" min="0" max="1000" step="0.1" placeholder="npr. 8,5">
        </div>
        <div id="w-hr" hidden>
          <label for="f-hr">Povprečni srčni pulz (bpm), neobvezno</label>
          <input type="number" id="f-hr" inputmode="numeric" min="30" max="250" step="1" placeholder="npr. 145">
        </div>
        <div id="w-power" hidden>
          <label for="f-power">Povprečna moč (W), neobvezno</label>
          <input type="number" id="f-power" inputmode="numeric" min="1" max="2000" step="1" placeholder="npr. 180">
        </div>
        <div id="w-cad" hidden>
          <label for="f-cad">Povprečna kadenca (vrt/min), neobvezno</label>
          <input type="number" id="f-cad" inputmode="numeric" min="1" max="250" step="1" placeholder="npr. 88">
        </div>
        <div class="full">
          <label for="f-note">Opomba, neobvezno</label>
          <input type="text" id="f-note" maxlength="200">
        </div>
        <div class="full actions">
          <button type="submit" class="primary">Dodaj vnos</button>
          <p class="error" id="error" role="alert"></p>
        </div>
      </div>
    </form>
  </section>

  <section aria-labelledby="h-compare">
    <h2 id="h-compare">Ta teden in prejšnji teden</h2>
    <div id="compare"></div>
  </section>

  <section aria-labelledby="h-list">
    <h2 id="h-list">Vnosi</h2>
    <div id="list"></div>
    <p class="status" id="status"></p>
  </section>
</main>

    return r ? h + " h " + r + " min" : h + " h";
  }
  function fmtKm(k) { return r1(k) + " km"; }
  function fmt(v) {
    var n = Math.round(v);
    if (metric === "min") return fmtMin(v);
    if (metric === "km") return fmtKm(v);
    if (metric === "hr") return n + " bpm";
    if (metric === "power") return n + " W";
    return n + " vrt/min";
  }
  function short(v) {
    if (metric === "min") return v < 60 ? Math.round(v) + " min" : r1(v / 60) + " h";

    return String(Math.round(v));
  }
  var METRICS = { min: "čas", km: "razdalja", hr: "povprečni pulz", power: "povprečna moč", cad: "povprečna kadenca" };
  function isAvg() { return metric === "hr" || metric === "power" || metric === "cad"; }
  function val(e) { return e[metric] || 0; }
  // vsota za čas in razdaljo; povprečje, tehtano s trajanjem, za pulz, moč in kadenco
  function aggregate(list) {

  function persist(years) {

          });
          if (merged.length || store.hasMeta) {
            if (touched) entries.forEach(function (e) { if (!seen[e.id]) { seen[e.id] = true; merged.push(e); } });
            entries = merged;

          var pending = {};
          entries.forEach(function (e) { if (!remoteIds[e.id]) pending[e.date.slice(0, 4)] = true; });
          var ys = Object.keys(pending);

  function loadSeedMarks() {
    try { return JSON.parse(localStorage.getItem(LS_SEEDS) || "{}") || {}; } catch (e) { return {}; }
  }
  function applySeed() {
    if (store.user && !store.user.isOwner()) return;
    var marks = loadSeedMarks();
    if (marks[SEED_ID] || store.seeds[SEED_ID]) return;
    var have = {}, years = {}, added = 0, y0 = 9999, y1 = 0;
    entries.forEach(function (e) { have[e.id] = true; });
    SEED.forEach(function (r) {
      if (have[r[0]]) return;
      var e = { id: r[0], date: r[1], type: TYPES[r[2]], min: r[3], km: r[4], note: r[8] };
      if (r[5]) e.hr = r[5];
      if (r[6]) e.power = r[6];
      if (r[7]) e.cad = r[7];
      entries.push(e);
      var y = r[1].slice(0, 4);
      years[y] = true;
      added++;
      if (+y < y0) y0 = +y;
      if (+y > y1) y1 = +y;
    });
    marks[SEED_ID] = true;
    store.seeds[SEED_ID] = true;
    try { localStorage.setItem(LS_SEEDS, JSON.stringify(marks)); } catch (e) {}

        .catch(function () { setStatus("dberr"); });
    }

      }
      s += '<text class="lab' + (isCur ? " curt" : "") + '" x="' + cx.toFixed(1) + '" y="' + (H - bot + 22) +
        '" text-anchor="middle">' + (isCur ? "ta teden" : fmtDM(k)) + "</text>";
    });
    s += "</svg>";
    el("chart").innerHTML = s;
  }

  function diffCell(d) {
    if (Math.abs(d) < 1e-9) return "0";
    return '<span class="' + (d > 0 ? "up" : "down") + '">' + (d > 0 ? "+" : "\u2212") + esc(fmt(Math.abs(d))) + "</span>";
  }
  function cellVal(v) { return v ? esc(fmt(v)) : "\u2013"; }

  function renderCompare() {
    var cur = weekKey(todayStr()), last = addDays(cur, -7);
    var rows = {};
    filtered().forEach(function (e) {
      var k = weekKey(e.date);
      if (k !== cur && k !== last) return;
      if (!(val(e) > 0)) return;
      rows[e.type] = rows[e.type] || { t: [], l: [] };
      rows[e.type][k === cur ? "t" : "l"].push(e);
    });
    var names = Object.keys(rows).sort();
    var box = el("compare");
    if (!names.length) {
      box.innerHTML = '<p class="empty">Ta in prejšnji teden še nimata podatkov za izbrani prikaz.</p>';
      return;
    }
    var all = { t: [], l: [] };
    var body = names.map(function (n) {
      var t = aggregate(rows[n].t), l = aggregate(rows[n].l);
      all.t = all.t.concat(rows[n].t);
      all.l = all.l.concat(rows[n].l);
      var d;
      if (isAvg()) d = (t && l) ? Math.round(t) - Math.round(l) : null;
      else d = t - l;
      return "<tr><td>" + esc(n) + "</td><td>" + cellVal(t) + "</td><td>" + cellVal(l) +
        "</td><td>" + (d === null ? "\u2013" : diffCell(d)) + "</td></tr>";
    }).join("");
    var foot = "";
    if (!isAvg()) {
      var tt = aggregate(all.t), ll = aggregate(all.l);
      foot = "<tfoot><tr><td>Skupaj</td><td>" + cellVal(tt) + "</td><td>" + cellVal(ll) + "</td><td>" +
        diffCell(tt - ll) + "</td></tr></tfoot>";
    }
    box.innerHTML = "<table><thead><tr><th>Aktivnost</th><th>Ta teden</th><th>Prejšnji teden</th><th>Razlika</th></tr></thead><tbody>" +
      body + "</tbody>" + foot + "</table>";
  }

  function renderList() {
    var list = filtered().slice();
    var box = el("list");
    if (!list.length) { box.innerHTML = '<p class="empty">Ni vnosov za prikaz.</p>'; return; }
    list.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.id < b.id ? 1 : -1); });
    var groups = {}, order = [];
    list.forEach(function (e) {
      var k = weekKey(e.date);
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(e);
    });
    var html = order.slice(0, 12).map(function (k) {
      var sum = aggregate(groups[k]);
      var items = groups[k].map(function (e) {
        var amount = fmtMin(e.min) + (e.km ? " (" + fmtKm(e.km) + ")" : "");
        var confirming = pendingDel === e.id;
        var parts = [];
        if (e.hr) parts.push("Ø pulz " + e.hr + " bpm");
        if (e.power) parts.push("Ø moč " + e.power + " W");
        if (e.cad) parts.push("Ø kadenca " + e.cad + " vrt/min");
        if (e.note) parts.push(e.note);
        var details = parts.join(", ");
        return '<li class="entry"><span>' + fmtDM(e.date) + "</span><span>" + esc(e.type) +
          '</span><span class="amount">' + esc(amount) + '</span><button type="button" class="del' +
          (confirming ? " confirm" : "") + '" data-del="' + esc(e.id) + '">' +
          (confirming ? "Res odstrani?" : "Odstrani") + "</button>" +
          (details ? '<span class="note">' + esc(details) + "</span>" : "") + "</li>";
      }).join("");
      return '<div class="week"><div class="week-head"><span>Teden od ' + fmtDM(k) + "</span><span>" +
        (sum ? esc(fmt(sum)) : "\u2013") + "</span></div><ul>" + items + "</ul></div>";
    }).join("");
    box.innerHTML = html;
  }

  function renderFilter() {
    var sel = el("filter");
    var opts = ['<option value="all">Vse</option>'].concat(TYPES.map(function (t) {
      return '<option value="' + esc(t) + '">' + esc(t) + "</option>";
    }));
    sel.innerHTML = opts.join("");
    sel.value = filter;
  }

  function render() {
    var totals = totalsByWeek(filtered());
    renderSummary(totals);
    renderChart(totals);
    renderCompare();
    renderList();
    renderStatus();
    document.querySelectorAll("[data-metric]").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-metric") === metric ? "true" : "false");
    });
  }

  // ---------- events ----------
  document.querySelectorAll("[data-metric]").forEach(function (b) {
    b.addEventListener("click", function () { metric = b.getAttribute("data-metric"); render(); });
  });
  el("filter").addEventListener("change", function (ev) { filter = ev.target.value; pendingDel = null; render(); });

  el("list").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-del]");
    if (!b) return;
    var id = b.getAttribute("data-del");
    if (pendingDel === id) {
      var gone = entries.filter(function (e) { return e.id === id; })[0];
      entries = entries.filter(function (e) { return e.id !== id; });
      pendingDel = null;
      persist(gone ? [gone.date.slice(0, 4)] : []);
    } else {
      pendingDel = id;
    }
    render();
  });

  el("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var err = el("error");
    var date = el("f-date").value;
    var type = el("f-type").value;
    var min = parseInt(el("f-min").value, 10);
    var kmRaw = el("f-km").value.replace(",", ".");
    var km = kmRaw === "" ? 0 : parseFloat(kmRaw);
    var note = el("f-note").value.trim();
    var hrOn = HR_TYPES.indexOf(type) !== -1, bikeOn = type === BIKE;
    var hr = hrOn && el("f-hr").value !== "" ? parseInt(el("f-hr").value, 10) : 0;
    var power = bikeOn && el("f-power").value !== "" ? parseInt(el("f-power").value, 10) : 0;
    var cad = bikeOn && el("f-cad").value !== "" ? parseInt(el("f-cad").value, 10) : 0;
    if (!date) { err.textContent = "Izberi datum."; return; }
    if (!(min >= 1 && min <= 1440)) { err.textContent = "Vnesi trajanje v minutah (1–1440)."; return; }
    if (isNaN(km) || km < 0 || km > 1000) { err.textContent = "Razdalja mora biti med 0 in 1000 km."; return; }
    err.textContent = "";
    if (hrOn && el("f-hr").value !== "" && !(hr >= 30 && hr <= 250)) { err.textContent = "Srčni pulz mora biti med 30 in 250 bpm."; return; }
    if (bikeOn && el("f-power").value !== "" && !(power >= 1 && power <= 2000)) { err.textContent = "Moč mora biti med 1 in 2000 W."; return; }
    if (bikeOn && el("f-cad").value !== "" && !(cad >= 1 && cad <= 250)) { err.textContent = "Kadenca mora biti med 1 in 250 vrt/min."; return; }
    var entry = { id: newId(), date: date, type: type, min: min, km: Math.round(km * 10) / 10, note: note };
    if (hrOn && hr) entry.hr = hr;
    if (bikeOn && power) entry.power = power;
    if (bikeOn && cad) entry.cad = cad;
    entries.push(entry);
    persist([date.slice(0, 4)]);
    el("f-min").value = "";
    el("f-km").value = "";
    el("f-note").value = "";
    el("f-hr").value = "";
    el("f-power").value = "";
    el("f-cad").value = "";
    el("f-min").focus();
    render();
  });

  // ---------- start ----------
  el("f-type").innerHTML = TYPES.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + "</option>"; }).join("");
  function updateFields() {
    var t = el("f-type").value;
    el("w-hr").hidden = HR_TYPES.indexOf(t) === -1;
    el("w-power").hidden = t !== BIKE;
    el("w-cad").hidden = t !== BIKE;
  }
  el("f-type").addEventListener("change", updateFields);
  el("f-date").value = todayStr();
  updateFields();
  renderFilter();
  entries = loadLocal();
  render();
  initStore().then(applySeed).catch(function () {});
})();
</script>
</body>
</html>
